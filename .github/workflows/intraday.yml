name: Intraday Forex Scans

# Scheduling architecture:
#   9am Auckland (morning scan) — GitHub Actions built-in schedule.
#     A 15-60 minute queue delay is acceptable for the morning scan.
#     cron: "5 21 * * 0-4" = 21:05 UTC Sun-Thu = 9:05am Auckland Mon-Fri.
#   5pm and 11pm scans — triggered exclusively by cron-job.org via
#     workflow_dispatch API with scan_mode input. cron-job.org tracks
#     NZST/NZDT DST changes correctly; GitHub built-in schedule fires
#     in fixed UTC and would create duplicate runs for those windows.

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Override scan mode (morning / prelondon / preny / full / gap)'
        required: false
        default: ''
  schedule:
    - cron: "5 21 * * 0-4"   # 9:05am Auckland Mon-Fri (morning scan backup)

concurrency:
  group: intraday-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set scan mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SCAN_MODE=morning" >> $GITHUB_ENV
          else
            echo "SCAN_MODE=${{ inputs.scan_mode }}" >> $GITHUB_ENV
          fi

      - name: Run intraday scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          ANTHROPIC_ACCOUNT_NAME: ${{ secrets.ANTHROPIC_ACCOUNT_NAME || 'Primary' }}
          ANTHROPIC_ACCOUNT_NAME_2: ${{ secrets.ANTHROPIC_ACCOUNT_NAME_2 || 'Backup' }}
          DAILY_COST_USD: ${{ secrets.DAILY_COST_USD || '0.05' }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY: ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          SCAN_MODE: ${{ env.SCAN_MODE }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: intraday scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main

  notify-failure:
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Intraday Scan (intraday.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

  publish-dashboard:
    needs: scan
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
