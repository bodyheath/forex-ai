name: Intraday Forex Scans

# The four cron-job.org-triggered slots below are triggered exclusively by
# cron-job.org via workflow_dispatch (no GHA schedule -- cron-job.org
# controls their timing, and their exact real-world UTC times are not
# independently verifiable from this repo).
#
# cron-job.org jobs (all times Auckland NZST = UTC+12):
#   9:05am  Mon-Fri → scan_mode=morning   (cron: 5 21 * * 0-4 UTC)  — Auckland morning setup
#   5:05pm  Mon-Fri → scan_mode=prelondon (cron: 5 5 * * 1-5 UTC)   — 2h pre-London open
#   11:05pm Mon-Fri → scan_mode=preny     (cron: 5 11 * * 1-5 UTC)  — 2h pre-NY open
#   1:05am  Mon-Fri → scan_mode=nyopen    (cron: 5 13 * * 1-5 UTC)  — NY open momentum    ← still not added
#
# 2026-08-26: the "london" slot below this comment used to be marked "← ADD"
# here too -- never wired up. Added as a genuine GHA-native `schedule:`
# trigger instead of a fifth cron-job.org job: confirmed via real GitHub
# Actions run timestamps that the existing 4 slots land at 05:05 UTC
# (prelondon) and 21:05 UTC (morning) -- both inside the unconditional
# London/NY session gate's dead zone (UTC 21:00-06:59, daily.py, blocks 21
# of the 28-pair universe in every regime, confirmed via the full system
# audit) -- leaving an ~17h blackout (18:05 UTC one day to 11:05 UTC the
# next) with zero fund-eligible opportunity for those 21 pairs, regardless
# of setup quality. Backtest (strict/v2/post-fix): real sonnet-confirmed
# non-asia_fx candidates that existed during the two dead-zone-timed scans
# (n=26) show WR=46.2%, PF=1.376, p=0.019 vs the strict aggregate -- these
# aren't low-quality setups, they're timing-excluded good ones. 07:05 UTC
# lands immediately after the dead zone ends, cutting the blackout to two
# shorter gaps (07:05->11:05 = 4h, 18:05->07:05 next day = 13h). Purely
# additive -- no grading/confidence/session-gate logic touched anywhere;
# this candidate pool goes through the exact same existing pipeline, just
# gets one more chance to run at a time the existing gate doesn't reject it
# on. Also independent of cron-job.org for this one slot, same rationale as
# heartbeat_watchdog.yml.

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode (morning / prelondon / london / preny / nyopen / full / gap)'
        required: false
        default: ''
  schedule:
    - cron: '5 7 * * 1-5'   # 07:05 UTC, Mon-Fri -> SCAN_MODE=london (see comment above)

concurrency:
  group: intraday-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-08-26: see daily.yml for rationale (60m vs. the 45m internal warning
    # and the 6h GHA platform default no workflow here had set explicitly).
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          ANTHROPIC_ACCOUNT_NAME: ${{ secrets.ANTHROPIC_ACCOUNT_NAME || 'Primary' }}
          ANTHROPIC_ACCOUNT_NAME_2: ${{ secrets.ANTHROPIC_ACCOUNT_NAME_2 || 'Backup' }}
          DAILY_COST_USD: ${{ secrets.DAILY_COST_USD || '0.05' }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY: ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          SCAN_MODE: ${{ github.event_name == 'schedule' && 'london' || inputs.scan_mode }}
          DISCORD_WEBHOOK_FUND: ${{ secrets.DISCORD_WEBHOOK_FUND }}
          DISCORD_WEBHOOK_RESEARCH: ${{ secrets.DISCORD_WEBHOOK_RESEARCH }}
          DISCORD_WEBHOOK_MONITOR: ${{ secrets.DISCORD_WEBHOOK_MONITOR }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        # 2026-08-26: if: always() -- same rationale as daily.yml (crash-safe
        # commit; trades.csv/research_trades.csv are atomically written, so
        # whatever's on disk after a crash is always a valid prior version).
        # Also added the absorb_remote_trades.py pre-merge call this workflow
        # was missing entirely (daily.yml and monitor.yml already had it,
        # for trades.csv only -- the script itself was generalized the same
        # day to also cover research_trades.csv in all three workflows).
        if: always()
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Absorb any rows added to origin/main by a concurrent scan or monitor
          # run before staging, so the -X ours rebase below doesn't discard them.
          python scripts/absorb_remote_trades.py
          git add data/ docs/ 2>/dev/null || true
          # ML model files are managed exclusively by retrain_ml.yml — never commit from intraday
          # scans. This prevents modify/delete conflicts if a reset moves origin while the runner
          # holds a stale checkout with older model files present.
          git restore --staged data/online_model.pkl data/online_model_meta.json 2>/dev/null || true
          git restore --staged data/ml_model.pkl data/ml_model_meta.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: intraday scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSHED=false
          for i in 1 2 3; do
            if ! git pull --rebase -X ours origin main 2>&1; then
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main 2>&1 || true
            fi
            if git push origin HEAD:main 2>&1; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed — waiting 10 seconds"
            sleep 10
          done
          if [ "$PUSHED" = "false" ]; then
            echo "All 3 push attempts failed"
            exit 1
          fi

  notify-failure:
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Intraday Scan (intraday.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on failure
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Intraday Scan FAILED\",\"description\":\"GitHub Actions workflow did not complete\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true

  publish-dashboard:
    needs: scan
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
