name: Intraday Forex Scans

# Three focused scans per weekday (Auckland time, NZST = UTC+12):
#   9am  NZ → 21:00 UTC previous day  (Asian session: AUD/NZD/JPY focus)
#   1pm  NZ → 01:00 UTC same day      (Midday: all pairs)
#   3pm  NZ → 03:00 UTC same day      (Pre-London: EUR/GBP/CHF focus)
#
# Note: during NZDT (Oct–Mar, UTC+13) each trigger fires 1 hour early in NZ time.
# The script's _get_scan_mode() reads the actual Auckland clock so it always
# selects the correct session focus regardless of DST.

on:
  schedule:
    # 9am Auckland (Mon–Fri NZST): Sun–Thu 21:00 UTC
    - cron: '0 21 * * 0-4'
    # 1pm Auckland (Mon–Fri NZST): Mon–Fri 01:00 UTC
    - cron: '0 1 * * 1-5'
    # 3pm Auckland (Mon–Fri NZST): Mon–Fri 03:00 UTC
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Override scan mode (asian / midday / prelondon / full)'
        required: false
        default: ''

concurrency:
  group: intraday-forex
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          ANTHROPIC_ACCOUNT_NAME: ${{ secrets.ANTHROPIC_ACCOUNT_NAME || 'Primary' }}
          ANTHROPIC_ACCOUNT_NAME_2: ${{ secrets.ANTHROPIC_ACCOUNT_NAME_2 || 'Backup' }}
          DAILY_COST_USD: ${{ secrets.DAILY_COST_USD || '0.05' }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY: ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: intraday scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
