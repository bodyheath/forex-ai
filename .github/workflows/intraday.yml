name: Intraday Forex Scans

# Primary scheduling: cron-job.org calls the workflow_dispatch API at exact
# Auckland times, correctly tracking NZST/NZDT DST changes.
#
# Backup schedule below fires in UTC — does NOT track DST (off by 1h during
# NZDT Oct–Apr). Use only as a fallback if cron-job.org is unreachable.
#
# Schedule (Auckland / UTC):
#   9am  Auckland = 21:00 UTC (Sun–Thu = Mon–Fri NZT)
#   5pm  Auckland = 05:00 UTC (Mon–Fri)
#   11pm Auckland = 11:00 UTC (Mon–Fri)

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Override scan mode (morning / prelondon / preny / full)'
        required: false
        default: ''
  schedule:
    # Backup cron (UTC — static, does not track DST; cron-job.org is primary)
    - cron: '0 21 * * 0-4'  # ~9am Auckland Mon-Fri (NZST; Sun-Thu UTC)
    - cron: '0 5 * * 1-5'   # ~5pm Auckland Mon-Fri
    - cron: '0 11 * * 1-5'  # ~11pm Auckland Mon-Fri

concurrency:
  group: intraday-forex
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          ANTHROPIC_ACCOUNT_NAME: ${{ secrets.ANTHROPIC_ACCOUNT_NAME || 'Primary' }}
          ANTHROPIC_ACCOUNT_NAME_2: ${{ secrets.ANTHROPIC_ACCOUNT_NAME_2 || 'Backup' }}
          DAILY_COST_USD: ${{ secrets.DAILY_COST_USD || '0.05' }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY: ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: intraday scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
