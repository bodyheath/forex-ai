name: Between-Scan Price Check

# Scheduling via cron-job.org → workflow_dispatch (same pattern as intraday.yml).
# cron-job.org tracks NZST/NZDT DST transitions automatically.
#
# Suggested cron-job.org schedule: every 2 hours during active Auckland sessions:
#   Asian session  (7pm–4am Auckland)  → approx 07:00–16:00 UTC
#   London/NY session (9am–6pm Auckland) → approx 21:00–06:00 UTC
#
# Simple trigger: fire every 2 hours at :00 (00:00, 02:00, 04:00, ... UTC).
# The script itself is stateless — duplicate/missed fires are harmless.

on:
  workflow_dispatch:

concurrency:
  group: price-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run between-scan price check
        env:
          TWELVE_DATA_KEY:    ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          ACCOUNT_BALANCE:    ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY:   ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
        run: python check_prices.py

      - name: Commit state changes
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/partial_profit_state.json data/trades.csv data/fund_state.json 2>/dev/null || true
          git add data/discord_dashboard.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: price check $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSHED=false
          for i in 1 2 3; do
            if ! git pull --rebase -X ours origin main 2>&1; then
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main 2>&1 || true
            fi
            if git push origin HEAD:main 2>&1; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed — waiting $((i * 5)) seconds"
            sleep $((i * 5))
          done
          if [ "$PUSHED" = "false" ]; then
            echo "All 3 push attempts failed"
            exit 1
          fi

  notify-failure:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Price Check (price_check.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF
