name: Between-Scan Monitor

# Scheduling is handled exclusively by cron-job.org every 30 minutes.
# No GitHub Actions built-in schedule — cron-job.org controls exact timing.
#
# Cost estimate:
#   ~2 minutes per run × 48 runs/day × 30 days = ~2880 minutes/month
#   (free tier: 2000 min/month — keep an eye on usage)
#
# API estimate:
#   Prices: 0 Twelve Data calls — Yahoo Finance batch download (15min delay, acceptable for swing trades)
#   OHLCV:  0 Twelve Data calls — Yahoo Finance 1H candles used for all trades
#   TD fallback triggers only if Yahoo returns <50% pairs (rare edge case)
#   Normal operation: 0 Twelve Data calls per monitor run — zero rate limit risk.

on:
  workflow_dispatch:

concurrency:
  group: monitor-trades
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 2026-08-26: runs every 30 minutes and normally takes ~2 minutes (see
    # header comment above); 15m leaves generous margin for a slow run while
    # still clearing well before too many 30-minute cycles would otherwise be
    # silently blocked by a hang under the previous 6h GHA default.
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write  # needed to dispatch deploy-pages.yml (GITHUB_TOKEN pushes don't auto-trigger it)

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SCAN_MODE: monitor
          TWELVE_DATA_KEY:    ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          ACCOUNT_BALANCE:    ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY:   ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          DISCORD_WEBHOOK_FUND: ${{ secrets.DISCORD_WEBHOOK_FUND }}
          DISCORD_WEBHOOK_RESEARCH: ${{ secrets.DISCORD_WEBHOOK_RESEARCH }}
          DISCORD_WEBHOOK_MONITOR: ${{ secrets.DISCORD_WEBHOOK_MONITOR }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        # 2026-09-03: monitor.yml runs every 30 minutes -- far tighter than
        # daily.yml/intraday.yml's ~5x/day combined -- and daily.py's monitor
        # branch now regenerates data/dashboard.html on this same cadence.
        # Copying it into docs/ here is what actually gets that freshness to
        # the live Pages site; if: always() matches the same fix applied to
        # daily.yml/intraday.yml's identical step.
        if: always()
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit monitor state
        id: commit_monitor
        # 2026-08-26: if: always() -- same rationale as daily.yml/intraday.yml.
        # Previously a crash or a deliberate _scan_had_critical_failure exit
        # in `python daily.py` above would skip this step entirely (GHA's
        # implicit if: success()), discarding this run's trade/outcome data.
        # Safe because trades.csv/research_trades.csv are atomically written
        # (os.replace()-based temp-file-then-rename) -- a crash can only ever
        # leave the last successfully-written version on disk, never a
        # partial one.
        if: always()
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_files() {
            # 2026-09-04: replaced a curated per-file list with the same
            # wildcard intraday.yml has always safely used -- still scoped
            # to data/ and docs/ only, so this still never stages
            # workflow/source changes. Third recurrence of the same bug
            # (run_guard.json/risk_profile.json, then data/virtual_books/,
            # then shadow_rules.json, each silently discarded from this
            # workflow because a curated list can only include files someone
            # remembered to add). A wildcard structurally can't have that
            # failure mode.
            git add data/ docs/ 2>/dev/null || true
          }

          # 2026-08-29: rewritten from git-pull-rebase (with a --no-rebase
          # merge fallback) to fetch+reset--soft+recommit -- see daily.yml
          # for the full rationale (the old fallback caused real CSV
          # corruption twice, and the old rebase path itself, even without
          # the fallback, could silently drop a genuinely new row with exit
          # code 0 when absorb had already merged an origin-only row into
          # the same commit). fetch+reset--soft keeps every commit's diff
          # purely additive relative to origin's current tip, so there's
          # nothing left for a rebase to misinterpret as a conflict.
          git fetch origin main --quiet
          git reset --soft origin/main
          python scripts/absorb_remote_trades.py
          stage_files

          # Skip if nothing changed
          if git diff --staged --quiet; then
            echo "Nothing to commit — skipping push"
            exit 0
          fi

          git commit -m "chore: monitor $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Retry push up to 3 times — handles concurrent pushes from local auto-commits
          PUSHED=false
          for i in 1 2 3; do
            echo "Push attempt $i of 3"
            if git push origin HEAD:main 2>&1; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed — re-syncing to origin's current tip and retrying (no merge, no rebase)"
            git fetch origin main --quiet
            git reset --soft origin/main
            python scripts/absorb_remote_trades.py
            stage_files
            # NOT --amend: see daily.yml -- after reset --soft, HEAD is
            # origin's tip, so amend would replace that commit rather than
            # add a new child commit, producing a sibling that can never
            # fast-forward push.
            git diff --staged --quiet || git commit -m "chore: monitor $(date -u +'%Y-%m-%d %H:%M UTC')"
            sleep 15
          done

          if [ "$PUSHED" = "false" ]; then
            echo "All 3 attempts failed — deliberately did not fall back to a raw git merge/rebase (see 2026-08-29 fix). Manual review needed."
            exit 1
          fi

          # 2026-09-03: see daily.yml -- GITHUB_TOKEN-authored pushes don't
          # trigger other workflows' `on: push` triggers, so deploy-pages.yml
          # never fires from this commit path on its own (confirmed live: it
          # did not fire from this exact monitor run when this dashboard
          # cadence was first wired up). Dispatch it via API instead, which
          # isn't subject to that restriction.
          curl -s -o /dev/null -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}' || true

      - name: Alert on push failure
        if: failure() && steps.commit_monitor.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ MONITOR GIT PUSH FAILED — trade state may not have saved\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on push failure
        if: failure() && steps.commit_monitor.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Monitor Git Push FAILED\",\"description\":\"Trade state may not have saved\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true

  notify-failure:
    needs: monitor
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Between-Scan Monitor (monitor.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on failure
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Monitor FAILED\",\"description\":\"GitHub Actions workflow did not complete\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true
