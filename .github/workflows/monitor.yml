name: Between-Scan Monitor

# Scheduling is handled exclusively by cron-job.org every 30 minutes.
# No GitHub Actions built-in schedule — cron-job.org controls exact timing.
#
# Cost estimate:
#   ~2 minutes per run × 48 runs/day × 30 days = ~2880 minutes/month
#   (free tier: 2000 min/month — keep an eye on usage)
#
# API estimate:
#   Prices: 0 Twelve Data calls — Yahoo Finance batch download (15min delay, acceptable for swing trades)
#   OHLCV:  0 Twelve Data calls — Yahoo Finance 1H candles used for all trades
#   TD fallback triggers only if Yahoo returns <50% pairs (rare edge case)
#   Normal operation: 0 Twelve Data calls per monitor run — zero rate limit risk.

on:
  workflow_dispatch:

concurrency:
  group: monitor-trades
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SCAN_MODE:          monitor
          TWELVE_DATA_KEY:    ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          ACCOUNT_BALANCE:    ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY:   ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
        run: python daily.py

      - name: Commit monitor state
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trades.csv data/research_trades.csv data/monitor_log.json data/api_usage.json data/milestone_log.json data/monitor_history.json data/hot_zone_alerts.json data/fund_state.json data/movement_alerts.json data/watchlist_cache.json
          git diff --staged --quiet || git commit -m "chore: monitor $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
