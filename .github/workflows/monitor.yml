name: Between-Scan Monitor

# Scheduling is handled exclusively by cron-job.org every 30 minutes.
# No GitHub Actions built-in schedule — cron-job.org controls exact timing.
#
# Cost estimate:
#   ~2 minutes per run × 48 runs/day × 30 days = ~2880 minutes/month
#   (free tier: 2000 min/month — keep an eye on usage)
#
# API estimate:
#   Prices: 0 Twelve Data calls — Yahoo Finance batch download (15min delay, acceptable for swing trades)
#   OHLCV:  0 Twelve Data calls — Yahoo Finance 1H candles used for all trades
#   TD fallback triggers only if Yahoo returns <50% pairs (rare edge case)
#   Normal operation: 0 Twelve Data calls per monitor run — zero rate limit risk.

on:
  workflow_dispatch:

concurrency:
  group: monitor-trades
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SCAN_MODE: monitor
          TWELVE_DATA_KEY:    ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          ACCOUNT_BALANCE:    ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY:   ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          DISCORD_WEBHOOK_FUND: ${{ secrets.DISCORD_WEBHOOK_FUND }}
          DISCORD_WEBHOOK_RESEARCH: ${{ secrets.DISCORD_WEBHOOK_RESEARCH }}
          DISCORD_WEBHOOK_MONITOR: ${{ secrets.DISCORD_WEBHOOK_MONITOR }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
        run: python daily.py

      - name: Commit monitor state
        id: commit_monitor
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only specific data files — never stage workflow/code changes
          git add data/trades.csv                   2>/dev/null || true
          git add data/research_trades.csv          2>/dev/null || true
          git add data/fund_state.json              2>/dev/null || true
          git add data/monitor_log.json             2>/dev/null || true
          git add data/heartbeat.json               2>/dev/null || true
          git add data/hot_zone_alerts.json         2>/dev/null || true
          git add data/milestone_log.json           2>/dev/null || true
          git add data/market_reopen.json           2>/dev/null || true
          git add data/run_guard.json               2>/dev/null || true
          git add data/discord_dashboard.json       2>/dev/null || true
          git add data/partial_profit_state.json    2>/dev/null || true
          git add data/online_model_meta.json       2>/dev/null || true
          git add data/online_model.pkl             2>/dev/null || true
          git add data/trade_features.csv           2>/dev/null || true
          git add data/pair_statistics.json         2>/dev/null || true
          git add data/watchlist_cache.json         2>/dev/null || true

          # Absorb any rows added to origin/main by a concurrent scan or monitor run.
          # Must happen before the commit so that git pull --rebase -X ours below
          # preserves these rows (it picks our version, which now includes them).
          python - <<'PYEOF'
import csv, subprocess, io, sys
try:
    subprocess.run(['git', 'fetch', 'origin', 'main', '--quiet'],
                   check=False, capture_output=True)
    result = subprocess.run(['git', 'show', 'origin/main:data/trades.csv'],
                            capture_output=True)
    if result.returncode != 0:
        sys.exit(0)
    with open('data/trades.csv', encoding='utf-8-sig') as f:
        local_content = f.read()
    local_reader = csv.DictReader(io.StringIO(local_content))
    fieldnames = local_reader.fieldnames
    if not fieldnames:
        sys.exit(0)
    local_rows = list(local_reader)
    local_ids = {r['id'] for r in local_rows}
    remote_text = result.stdout.decode('utf-8-sig')
    new_rows = [r for r in csv.DictReader(io.StringIO(remote_text))
                if r['id'] not in local_ids]
    if not new_rows:
        sys.exit(0)
    all_rows = sorted(local_rows + new_rows, key=lambda r: int(r.get('id') or 0))
    print(f'Pre-merge: absorbing {len(new_rows)} new row(s) from origin/main', flush=True)
    with open('data/trades.csv', 'w', newline='', encoding='utf-8-sig') as f:
        w = csv.DictWriter(f, fieldnames=fieldnames)
        w.writeheader()
        w.writerows(all_rows)
    subprocess.run(['git', 'add', 'data/trades.csv'], check=False)
except Exception as e:
    print(f'Pre-merge skipped (non-fatal): {e}', file=sys.stderr)
PYEOF

          # Skip if nothing changed
          if git diff --staged --quiet; then
            echo "Nothing to commit — skipping push"
            exit 0
          fi

          git commit -m "chore: monitor $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Retry push up to 3 times — handles concurrent pushes from local auto-commits
          PUSHED=false
          for i in 1 2 3; do
            echo "Push attempt $i of 3"

            # Pull latest — prefer OUR local changes (trade closures, fund_state updates)
            # over remote on conflict. Remote may have an older state from a prior run.
            if ! git pull --rebase -X ours origin main 2>&1; then
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main 2>&1 || true
            fi

            if git push origin HEAD:main 2>&1; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi

            echo "Push attempt $i failed — waiting 15 seconds"
            sleep 15
          done

          if [ "$PUSHED" = "false" ]; then
            echo "All 3 push attempts failed"
            exit 1
          fi

      - name: Alert on push failure
        if: failure() && steps.commit_monitor.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ MONITOR GIT PUSH FAILED — trade state may not have saved\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on push failure
        if: failure() && steps.commit_monitor.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Monitor Git Push FAILED\",\"description\":\"Trade state may not have saved\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true

  notify-failure:
    needs: monitor
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Between-Scan Monitor (monitor.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on failure
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Monitor FAILED\",\"description\":\"GitHub Actions workflow did not complete\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true
