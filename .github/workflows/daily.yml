name: Daily Forex Analysis

on:
  schedule:
    - cron: '0 17 * * *'  # 6am NZDT (UTC+13, Oct–Apr daylight saving)
    - cron: '0 18 * * *'  # 6am NZST (UTC+12, Apr–Oct standard time)
  workflow_dispatch: # also lets you trigger a run manually from the Actions tab

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push updated dashboard and data back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: daily analysis $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
