name: Daily Forex Analysis

on:
  workflow_dispatch: # triggered manually or via cron-job.org API call

# Prevent simultaneous runs of the same workflow (e.g. cron-job.org retry +
# manual trigger).  cancel-in-progress: false lets any queued run start after
# the current one finishes — the Python duplicate-run guard then blocks it if
# it falls within the 90-minute cooldown window.
concurrency:
  group: forex-ai-daily
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    # 2026-08-26: no workflow in this repo had an explicit timeout before this
    # audit -- every job defaulted to GHA's 6-hour platform maximum. 60m is
    # comfortably above the internal 45-minute run-time warning already in
    # daily.py (_MAX_RUN_SECS) and drastically below the 6h default.
    timeout-minutes: 60
    permissions:
      contents: write # needed to push updated dashboard and data back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          ANTHROPIC_ACCOUNT_NAME: ${{ secrets.ANTHROPIC_ACCOUNT_NAME || 'Primary' }}
          ANTHROPIC_ACCOUNT_NAME_2: ${{ secrets.ANTHROPIC_ACCOUNT_NAME_2 || 'Backup' }}
          DAILY_COST_USD: ${{ secrets.DAILY_COST_USD || '0.05' }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000' }}
          ACCOUNT_CURRENCY: ${{ secrets.ACCOUNT_CURRENCY || 'USD' }}
          SCAN_MODE: full
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_FUND: ${{ secrets.DISCORD_WEBHOOK_FUND }}
          DISCORD_WEBHOOK_RESEARCH: ${{ secrets.DISCORD_WEBHOOK_RESEARCH }}
          DISCORD_WEBHOOK_MONITOR: ${{ secrets.DISCORD_WEBHOOK_MONITOR }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
        run: python daily.py

      - name: Copy dashboard to GitHub Pages
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/trades.csv docs/trades.csv

      - name: Commit and push results
        # 2026-08-26: if: always() so that a crash or a deliberate
        # _scan_had_critical_failure exit (daily.py returns 1) doesn't
        # discard this run's trade/outcome data. Safe specifically because
        # data/trades.csv and data/research_trades.csv are both written via
        # os.replace()-based atomic temp-file-then-rename (src/tracker.py,
        # src/research_tracker.py) -- a crash can never leave either in a
        # partially-written state, only ever the last successfully-written
        # version. The JSON state files staged below (fund_state.json etc.)
        # are NOT written atomically and could in principle be caught
        # mid-write by a crash -- a narrow, pre-existing risk this change
        # does not worsen (it existed under if: success() too, just for a
        # different trigger), tracked separately.
        if: always()
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_files() {
            git add data/trades.csv data/research_trades.csv data/fund_state.json 2>/dev/null || true
            git add data/price_cache.json data/discord_dashboard.json data/pair_statistics.json 2>/dev/null || true
            git add data/watchlist_cache.json data/loss_journal.json data/fund_feature_store.json 2>/dev/null || true
            git add data/online_learner.json data/dashboard.html data/partial_profit_state.json 2>/dev/null || true
            git add docs/ 2>/dev/null || true
          }

          # 2026-08-29: rewritten from git-pull-rebase (with a --no-rebase
          # merge fallback on failure) to fetch+reset--soft+recommit. Two
          # confirmed real problems with the old approach:
          #   1. The --no-rebase fallback is exactly what caused the
          #      2026-06/07 trades.csv/research_trades.csv triplication and
          #      fired again as recently as 2026-08-28 (that time on
          #      virtual_outcomes.csv) -- a generic line-based merge of two
          #      divergent full-file rewrites can silently keep both
          #      near-duplicate copies without ever flagging a conflict.
          #   2. Directly reproduced in testing: even the *primary* rebase
          #      path (no fallback involved) can silently DROP a genuinely
          #      new row with exit code 0 -- if absorb_remote_trades.py has
          #      already merged an origin-only row into the working tree
          #      before commit, that row is bundled into the same diff hunk
          #      as our own new row; rebasing that hunk onto a base that
          #      already has the absorbed row makes the whole hunk look
          #      like a conflict, and -X ours discards it whole, including
          #      the genuinely new row. This is data loss, not duplication,
          #      and doesn't even fail loudly.
          # Fix: fetch + `git reset --soft origin/main` (moves the branch
          # pointer, leaves the working tree/index untouched) BEFORE
          # staging+absorbing+committing, so the commit's diff-from-parent
          # is always purely additive relative to origin's current tip --
          # nothing for a rebase to misinterpret as a conflict. On a push
          # race, redo the same fetch+reset+restage+amend and retry --
          # never git pull --rebase or git merge on these files.
          git fetch origin main --quiet
          git reset --soft origin/main
          stage_files
          python scripts/absorb_remote_trades.py
          git diff --staged --quiet || git commit -m "chore: daily analysis $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSHED=false
          for i in 1 2 3; do
            if git push origin HEAD:main 2>&1; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "Push attempt $i failed — re-syncing to origin's current tip and retrying (no merge, no rebase)"
            git fetch origin main --quiet
            git reset --soft origin/main
            stage_files
            python scripts/absorb_remote_trades.py
            # NOT --amend: after reset --soft, HEAD is origin's tip, so
            # amend would replace THAT commit (inheriting its parent and
            # message) instead of adding a new child commit -- producing a
            # sibling that can never fast-forward push. A fresh commit here
            # is correctly a child of the just-fetched origin tip.
            git diff --staged --quiet || git commit -m "chore: daily analysis $(date -u +'%Y-%m-%d %H:%M UTC')"
            sleep 10
          done
          if [ "$PUSHED" = "false" ]; then
            echo "All 3 attempts failed — deliberately did not fall back to a raw git merge/rebase (see 2026-08-29 fix; the old fallback caused real CSV corruption twice, and the old rebase path itself could silently drop data). Manual review needed."
            exit 1
          fi

  notify-failure:
    needs: analyse
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — Daily Analysis (daily.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF

      - name: Notify Discord on failure
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_CRITICAL" ] && \
          curl -s -X POST "$DISCORD_WEBHOOK_CRITICAL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Daily Analysis FAILED\",\"description\":\"GitHub Actions workflow did not complete\",\"color\":16711680,\"fields\":[{\"name\":\"Run URL\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
          || true

  publish-dashboard:
    needs: analyse
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
