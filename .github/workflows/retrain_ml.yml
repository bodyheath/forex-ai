name: Weekly ML Model Retrain

on:
  schedule:
    # Every Monday at 18:00 UTC = ~6am Tuesday Auckland (NZST UTC+12)
    - cron: '0 18 * * 1'
  workflow_dispatch:    # allow manual trigger any time

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain ML model
        run: |
          python -c "
          import sys
          from src.ml_predictor import train
          result = train(quiet=False)
          if result.get('skipped'):
              print('INFO: ML retraining skipped --', result.get('message', 'insufficient data'))
              sys.exit(0)
          elif result.get('error'):
              print('INFO: ML retraining skipped --', result['error'])
              sys.exit(0)
          else:
              print('Model trained successfully.')
              print('  Trades:  ', result.get('n_trades'))
              print('  Win rate:', result.get('win_rate'))
              print('  ROC-AUC: ', result.get('roc_auc'))
              print('  Type:    ', result.get('model_type'))
          "

      - name: Commit model artifacts
        run: |
          git config user.name "forex-ai[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml_model.pkl data/ml_model_meta.json || true
          git diff --staged --quiet || git commit -m "chore: weekly ML model retrain $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main

  notify-failure:
    needs: retrain
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_CHAT_ID_3: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_ids = [c for c in [
              os.environ.get("TELEGRAM_CHAT_ID", ""),
              os.environ.get("TELEGRAM_CHAT_ID_2", ""),
              os.environ.get("TELEGRAM_CHAT_ID_3", ""),
          ] if c]
          if not token or not chat_ids:
              exit(0)
          msg = f"⛔ SYSTEM FAILURE — ML Retrain (retrain_ml.yml) failed\n{os.environ.get('RUN_URL', '')}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for chat_id in chat_ids:
              try:
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Failed to send to {chat_id}: {e}")
          EOF
